version: '3.8'

services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: asrs_mqtt
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  backend:
    build: ./backend
    container_name: asrs_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:1234@host.docker.internal:5432/smartwarehouse
      MQTT_BROKER_URL: mqtt://mqtt:1883
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mqtt

  frontend:
    build: ./frontend
    container_name: asrs_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: asrs_tunnel
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      - frontend

