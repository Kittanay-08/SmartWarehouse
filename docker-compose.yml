name: smartwarehouse

services:
  db:
    image: postgres:15-alpine
    container_name: asrs_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: warehouse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: asrs_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:1234@db:5432/warehouse
    volumes:
      - ./backend/data:/app/data
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: asrs_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    name: smartwarehouse_postgres_data
